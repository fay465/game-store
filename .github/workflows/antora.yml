name: Publish Antora to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # no es estrictamente necesario, pero ayuda con metadatos de git
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g @antora/cli @antora/site-generator
      - run: antora docs/antora-playbook.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
